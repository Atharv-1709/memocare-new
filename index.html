<!doctype html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eaf5ff">
  <meta name="description"
    content="MemoCare is a private, accessible memory, medication, safety, and daily-assistance companion.">
  <title>MemoCare</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/pages.css">
  <script src="https://js.puter.com/v2/" defer></script>
  <script type="module" src="./js/app.js"></script>
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <div id="offline-banner" class="offline-banner" role="status" hidden>
    You are offline. Saved information is still available.
  </div>

  <div class="app-shell">
    <aside class="sidebar glass-panel" aria-label="Primary navigation">
      <a class="brand" href="#home" aria-label="MemoCare home">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span><strong>MemoCare</strong><small>Care, remembered.</small></span>
      </a>
      <nav id="desktop-nav" class="nav-list"></nav>
      <div class="sidebar-footer">
        <span id="local-data-status" class="status-pill status-safe">On-device data</span>
        <button class="button button-ghost button-block" type="button" data-action="open-accessibility">
          <span aria-hidden="true">Aa</span> <span data-i18n="a11y.title">Accessibility</span>
        </button>
      </div>
    </aside>

    <div class="app-column">
      <header class="topbar glass-panel">
        <div>
          <p class="eyebrow" id="orientation-date"></p>
          <h1 class="topbar-title" id="route-title">Home</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" type="button" data-action="speak-page" aria-label="Read this page aloud"
            title="Read this page aloud">
            <span aria-hidden="true">◖</span>
          </button>
          <button class="profile-button" id="profile-button" type="button" data-action="open-auth"
            aria-label="Open profile and sign in">
            <span id="profile-initials">G</span>
          </button>
        </div>
      </header>

      <main id="main-content" tabindex="-1"></main>
    </div>
  </div>

  <nav id="mobile-nav" class="mobile-nav glass-panel" aria-label="Mobile navigation"></nav>

  <button class="emergency-fab" type="button" data-action="open-emergency" aria-label="Open emergency help">
    <span aria-hidden="true">SOS</span>
  </button>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <dialog id="app-dialog" class="app-dialog glass-panel">
    <form method="dialog" class="dialog-shell">
      <div class="dialog-header">
        <div>
          <p class="eyebrow" id="dialog-eyebrow"></p>
          <h2 id="dialog-title">Dialog</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Close dialog">×</button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
      <div id="dialog-actions" class="dialog-actions"></div>
    </form>
  </dialog>

  <dialog id="auth-dialog" class="app-dialog glass-panel">
    <form method="dialog" class="dialog-shell" id="auth-form">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Private account</p>
          <h2 id="auth-title" data-i18n="auth.title">Welcome to MemoCare</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Close account dialog">×</button>
      </div>
      <div id="auth-content" class="dialog-body"></div>
    </form>
  </dialog>

  <dialog id="accessibility-dialog" class="app-dialog glass-panel">
    <form method="dialog" class="dialog-shell">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Make MemoCare easier to use</p>
          <h2 data-i18n="a11y.title">Accessibility</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Close accessibility settings">×</button>
      </div>
      <div class="dialog-body settings-stack">
        <label class="setting-row">
          <span><strong data-i18n="a11y.textSize">Text size</strong><small>Increase all interface text.</small></span>
          <select id="text-size-control">
            <option value="normal">Normal</option>
            <option value="large">Large</option>
            <option value="xlarge">Extra large</option>
          </select>
        </label>
        <label class="setting-row">
          <span><strong data-i18n="a11y.contrast">High contrast</strong><small>Stronger borders and
              colours.</small></span>
          <input id="contrast-control" type="checkbox" role="switch">
        </label>
        <label class="setting-row">
          <span><strong data-i18n="a11y.motion">Reduce motion</strong><small>Stops decorative movement.</small></span>
          <input id="motion-control" type="checkbox" role="switch">
        </label>
        <label class="setting-row">
          <span><strong data-i18n="a11y.buttons">Large buttons</strong><small>Bigger touch targets.</small></span>
          <input id="large-buttons-control" type="checkbox" role="switch">
        </label>
        <label class="setting-row">
          <span><strong data-i18n="a11y.simple">Simplified view</strong><small>Shows fewer choices at
              once.</small></span>
          <input id="simple-control" type="checkbox" role="switch">
        </label>
      </div>
      <div class="dialog-actions">
        <button class="button button-primary" value="cancel" data-i18n="common.done">Done</button>
      </div>
    </form>
  </dialog>

  <template id="loading-template">
    <section class="page-section" aria-busy="true">
      <div class="skeleton skeleton-title"></div>
      <div class="dashboard-grid">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </section>
  </template>

  <noscript>
    <div class="noscript">MemoCare needs JavaScript for reminders and interactive assistance. Your saved data is not
      sent anywhere by this message.</div>
  </noscript>
</body>

</html>
